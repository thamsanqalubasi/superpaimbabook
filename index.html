<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paimbabook | Super Admin Console</title>
    <meta name="description" content="Paimbabook Master Super Admin Governance & Global Operations Console" />
    <link rel="icon" type="image/png" href="/iconlogo.png" />
    <link rel="apple-touch-icon" href="/iconlogo.png" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem("super_theme");
          if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
